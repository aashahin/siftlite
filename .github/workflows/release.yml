name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to npm (owner-gated; default versions a PR only)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    name: version
    if: ${{ inputs.publish == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create version PR
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          publish: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs Node >=22.14 and npm >=11.5.1.
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Publish
        uses: changesets/action@v1
        with:
          # Provenance is produced by npm trusted publishing (OIDC).
          # Do not inject an empty NODE_AUTH_TOKEN; that writes a blank
          # //registry.npmjs.org/:_authToken and disables OIDC.
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
